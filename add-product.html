<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>إضافة منتج | MR.VALOR</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .add-product-page {
      min-height: 100vh;
      padding: 120px 20px 70px;
    }

    .add-product-container {
      max-width: 850px;
      margin: auto;
    }

    .add-product-header {
      text-align: center;
      margin-bottom: 35px;
    }

    .add-product-header h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .add-product-header p {
      color: #9ca3af;
      font-size: 16px;
    }

    .product-form {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 35px;
      backdrop-filter: blur(15px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-group label {
      display: block;
      margin-bottom: 9px;
      font-weight: 600;
      color: #fff;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      box-sizing: border-box;
      padding: 15px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.25);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139,92,246,0.12);
    }

    .form-group textarea {
      min-height: 140px;
      resize: vertical;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .form-hint {
      display: block;
      margin-top: 7px;
      color: #777f8d;
      font-size: 12px;
    }

    .image-box {
      border: 1px dashed rgba(255,255,255,0.18);
      border-radius: 15px;
      padding: 25px;
      text-align: center;
      background: rgba(255,255,255,0.02);
    }

    .image-box input {
      border: none;
      background: transparent;
      padding: 10px;
    }

    .form-actions {
      display: flex;
      gap: 12px;
      margin-top: 30px;
    }

    .form-actions button,
    .form-actions a {
      flex: 1;
      text-align: center;
      padding: 15px 20px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }

    .submit-product {
      border: none;
      color: white;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
    }

    .cancel-product {
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      background: rgba(255,255,255,0.04);
    }

    @media (max-width: 650px) {
      .add-product-header h1 {
        font-size: 30px;
      }

      .product-form {
        padding: 22px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .form-actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container nav-container">

      <a href="index.html" class="logo">
        MR.<span>VALOR</span>
      </a>

      <nav class="main-nav">
        <a href="index.html">الرئيسية</a>
        <a href="index.html#products">المنتجات</a>
        <a href="index.html#categories">التصنيفات</a>
        <a href="index.html#about">عن Mr.Valor</a>
      </nav>

      <div class="nav-actions">
        <a href="index.html" class="nav-cart">
          🛒
          <span id="cart-count">0</span>
        </a>
      </div>

    </div>
  </header>


  <!-- Add Product -->
  <main class="add-product-page">

    <div class="add-product-container">

      <div class="add-product-header">
        <h1>أضف منتجك 🚀</h1>
        <p>
          أضف منتجك الرقمي إلى Mr.Valor وابدأ في عرضه للعملاء.
        </p>
      </div>


      <form class="product-form" id="add-product-form">

        <!-- Product Name -->
        <div class="form-group">
          <label for="product-name">اسم المنتج</label>

          <input
            type="text"
            id="product-name"
            placeholder="مثال: Social Media Content Pack"
            required
          >
        </div>


        <!-- Description -->
        <div class="form-group">
          <label for="product-description">وصف المنتج</label>

          <textarea
            id="product-description"
            placeholder="اكتب وصفًا واضحًا ومختصرًا للمنتج..."
            required
          ></textarea>
        </div>


        <!-- Price + Category -->
        <div class="form-row">

          <div class="form-group">
            <label for="product-price">السعر بالدولار</label>

            <input
              type="number"
              id="product-price"
              placeholder="7"
              min="0"
              step="0.01"
              required
            >
          </div>


          <div class="form-group">
            <label for="product-category">التصنيف</label>

            <select id="product-category" required>
              <option value="">اختر التصنيف</option>
              <option value="canva">Canva Templates</option>
              <option value="sheets">Google Sheets</option>
              <option value="excel">Excel</option>
              <option value="other">منتجات أخرى</option>
            </select>
          </div>

        </div>


        <!-- Product Link -->
        <div class="form-group">
          <label for="product-link">رابط المنتج</label>

          <input
            type="url"
            id="product-link"
            placeholder="https://canva.link/..."
            required
          >

          <span class="form-hint">
            ضع رابط تسليم المنتج مثل رابط Canva أو رابط الملف.
          </span>
        </div>


        <!-- Product Image -->
        <div class="form-group">

          <label for="product-image">صورة المنتج</label>

          <div class="image-box">

            <input
              type="file"
              id="product-image"
              accept="image/*"
            >

            <span class="form-hint">
              اختر صورة أو معاينة للمنتج.
            </span>

          </div>

        </div>


        <!-- Actions -->
        <div class="form-actions">

          <button
            type="submit"
            class="submit-product"
          >
            إضافة المنتج
          </button>

          <a
            href="index.html"
            class="cancel-product"
          >
            إلغاء
          </a>

        </div>

      </form>

    </div>

  </main>


  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <p>© 2026 MR.VALOR — جميع الحقوق محفوظة.</p>
    </div>
  </footer>


  <script src="script.js"></script>

  <script>
    const form = document.getElementById("add-product-form");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const name = document.getElementById("product-name").value;
      const price = document.getElementById("product-price").value;

      alert(
        `تم تجهيز المنتج "${name}" بسعر $${price}.\n\nسيتم ربط الإضافة الحقيقية بقاعدة البيانات لاحقًا.`
      );
    });
  </script>

</body>
  </html>
